<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Source for app/icon.svg and app/favicon.ico. Regenerate the .ico with:
       rsvg-convert -w 512 -h 512 assets/icon.svg -o /tmp/icon.png
       magick /tmp/icon.png -define icon:auto-resize=64,48,32,16 app/favicon.ico

       The site's mascot, reduced to the part that survives a browser tab: the
       /\_/\ of the ASCII cat, plus two eyes. Cream on solid brand green rather
       than green on cream, because at 16px a mark needs a hard edge to sit
       against — on a pale background the strokes go muddy and the eyes vanish.
       Stroke width and eye radius are set so both still land on whole pixels
       at 16px; thinning either one is what breaks it. -->
  <rect width="64" height="64" rx="14" fill="#1C8F4C"/>
  <g stroke="#F9F6F1" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7,40 L19,15 L29,40"/>
    <path d="M35,40 L45,15 L57,40"/>
    <path d="M27,40 L37,40"/>
  </g>
  <circle cx="23" cy="52" r="4.2" fill="#F9F6F1"/>
  <circle cx="41" cy="52" r="4.2" fill="#F9F6F1"/>
</svg>
